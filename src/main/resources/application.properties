spring.application.name=cardapio-api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:10.0.1.75}:${DB_PORT:3306}/gpp_fulano?zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:${DB_USERNAME:g3_informatica}}
spring.datasource.password=${DB_PASSWORD:#g31nf#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Port
server.port=8081

# Application Feature Configuration
app.config.view-only=${VIEW_ONLY:false}
